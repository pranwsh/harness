[package]
name = "harness-file-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
harness-contracts = { path = "../../contracts" }
harness-core = { path = "../../core" }
harness-hash-base = { path = "../hash-base" }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
schemars = "1"
regex = "1"
globset = "0.4"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tiktoken-rs = "0.12"
tempfile = "3"
similar = "2"
uuid.workspace = true

[dev-dependencies]
harness-tools = { path = "../tools" }
