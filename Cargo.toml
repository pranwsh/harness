[workspace]
resolver = "2"
members = [
    "core",
    "contracts",
    "harness",
    "plugins/config",
    "plugins/model",
    "plugins/agent",
    "plugins/session",
    "plugins/tools",
    "plugins/system-prompt",
    "plugins/agent-default-model",
    "plugins/agent-loop",
    "plugins/repl",
]

[workspace.dependencies]
arc-swap = "1"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal"] }
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
