[workspace]
resolver = "2"
members = [
    "core",
    "contracts",
    "harness",
    "plugins/config",
    "plugins/model",
    "plugins/agent",
    "plugins/session",
    "plugins/tools",
    "plugins/read-file",
    "plugins/system-prompt",
    "plugins/agent-default-model",
    "plugins/agent-loop",
    "plugins/tui-state",
    "plugins/tui-markdown",
    "plugins/tui-input",
    "plugins/tui",
]

[workspace.dependencies]
arc-swap = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
mdfrier = { version = "3", features = ["ratatui"] }
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal", "fs"] }
toml = "0.9"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
