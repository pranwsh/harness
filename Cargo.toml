[workspace]
resolver = "2"
members = [
    "core",
    "contracts",
    "harness",
    "plugins/config",
    "plugins/model",
    "plugins/model-headers",
    "plugins/agent",
    "plugins/session",
    "plugins/tools",
    "plugins/hash-base",
    "plugins/hashline-read",
    "plugins/hashline-edit",
    "plugins/system-prompt",
    "plugins/agent-default-model",
    "plugins/agent-loop",
    "plugins/shell",
    "plugins/tui-state",
    "plugins/tui-markdown",
    "plugins/tui-input",
    "plugins/tui-popup",
    "plugins/tui",
]

[workspace.dependencies]
arc-swap = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures = "0.3"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal", "fs", "process"] }
toml = "0.9"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
