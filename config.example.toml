# Example configuration for `harness`.
#
# Resolution (see plugins/config/src/lib.rs and harness/src/cli.rs):
#   ./config.toml (cwd-relative) by default, or `harness --config PATH`.
#
# Copy to the default location and edit:
#   cp config.example.toml ./config.toml
# Or point at it explicitly:
#   harness --config ./config.toml

[llm]
base_url = "https://opencode.ai/zen/v1"
model = "muse-spark-1.3-contributor-free"
api_key = "public"
user_agent = "opencode/1.18.18"

# Identify as the official client: Zen rejects requests that don't look
# like they come from inside opencode ("can only be used in opencode").
# Merged into every LLM request by the model-headers plugin.
[llm.headers]
HTTP-Referer = "https://opencode.ai/"
X-Title = "opencode"

# Models that must use the Responses transport (POST {base_url}/responses)
# instead of chat completions. Extends the built-in muse-spark-* family
# mapping for future endpoint migrations; chat completions stays the default.
# responses_models = ["future-model-free"]

# Alternative: local llama.cpp server.
# [llm]
# base_url = "http://127.0.0.1:8080/v1"
# model = "<model-file.gguf>"
# api_key = "none"

[agent]
# Hard cap on model iterations per turn.
max_iterations = 128

# Conversation persistence. On by default: every session journals to one
# JSONL file under the session directory, and `/sessions` lists past
# sessions (select one to resume it). Each launch still starts a fresh
# session. `enabled = false` keeps everything in memory for the process
# lifetime. `dir` overrides the default `$XDG_DATA_HOME/harness/sessions`
# (`$HOME/.local/share/harness/sessions` when `XDG_DATA_HOME` is unset).
# [session]
# enabled = true
# dir = "/home/you/.local/share/harness/sessions"

# Agent Skills registry. On by default: each immediate child directory of
# the skills dir holding a SKILL.md becomes one skill (progressive
# disclosure: name + description in the prompt, full body via skill_read).
# `dir` overrides the default `$XDG_CONFIG_HOME/harness/skills`
# (`$HOME/.config/harness/skills` when `XDG_CONFIG_HOME` is unset).
# [skills]
# enabled = true
# dir = "/home/you/.config/harness/skills"

# Headless shell tools (shell_exec / shell_start / shell_poll / shell_stop).
# No policy guardrails: any executable runs. Resource bounds only (timeouts,
# output caps, max jobs). Policy belongs in a future guardrail plugin via
# the `tool.approval` waterfall. Run trusted work only, preferably in a container.
[shell]
default_timeout_ms = 30000
max_timeout_ms = 120000
max_output_bytes = 65536
max_capture_bytes = 1048576
max_jobs = 32
max_job_time_ms = 600000
max_job_output_bytes = 262144

# TUI palette. Absent means the built-in default; every key is optional and
# overrides only its own slot. The role vocabulary (which slots exist) is
# code, not config, so a typo can never desynchronize a renderer from the
# palette. Applied by the tui-theme plugin, which every painting TUI plugin
# injects -- swap that one plugin to re-theme the whole UI.
#
# Each slot takes a color: an ANSI name ("red", "light cyan"), a 256-color
# palette index ("240"), or a hex triple ("#a1b2c3"). Use the table form to
# set a background too. An unparseable value is reported on stderr and that
# one slot keeps its built-in color; it never takes the app down.
#
#   [theme.colors]
#   "text.user_border"      = "green"                    # message box outline
#   "chrome.input_border"  = "blue"                     # input box border
#   "text.error"            = { fg = "red", bg = "black" }
#   "markdown.emphasis"     = "220"                      # 256-color index
#
# Full slot list: text.{assistant,user,user_border,tool,error,error_emphasis,
# muted}, chrome.{input_border,input_title,input_title_busy,popup_border,
# popup_title,popup_cursor}, markdown.{emphasis,strong,strike,link_text,
# link_wrap,rule,table_border,table_header,list_marker,blockquote_0..5}.
#
# Only colors are configurable. Modifiers belong to the role (emphasis is
# italic because it is emphasis), so a recolor never strips what makes a
# slot that slot -- and components you leave unset keep their current value.
#
# [theme.colors]
# "text.user_border" = "green"

# syntect theme for fenced code blocks. Unknown names fall back to the
# built-in default (base16-ocean.dark) rather than failing.
# [theme.code]
# name = "base16-eighties.dark"

# MCP servers (stdio transport). Each `[mcp.servers.<name>]` spawns one
# persistent child speaking JSON-RPC 2.0 over stdio; its tools appear as
# `mcp__<server>__<tool>`. Absent means no MCP servers. One bad command
# never blocks the others. No policy guardrails: any command runs.
# [mcp.servers.fetch]
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-fetch"]
